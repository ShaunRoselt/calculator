name: Build dist

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: |
          npm run check
          npm test

  linux:
    name: Build Linux dist
    runs-on: ubuntu-latest
    needs: check

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'
          check-latest: true
          cache: npm

      - name: Install system packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder libfuse2 squashfs-tools xauth xvfb
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.freedesktop.Platform//26.08 org.freedesktop.Sdk//26.08

      - name: Install dependencies
        run: npm ci

      - name: Build Linux unpacked app
        run: npm run package:linux

      - name: Build Linux AppImage
        run: npm run package:linux:appimage

      - name: Build Linux Flatpak
        run: sh scripts/package-flatpak.sh

      - name: Smoke-test the packaged Linux apps
        run: |
          xvfb-run -a node scripts/smoke-desktop.cjs "dist/Roselt Calculator-linux-x64/calculator" --no-sandbox
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a node scripts/smoke-desktop.cjs dist/Linux\ AppImage/*.AppImage --no-sandbox
          flatpak install --user --noninteractive --bundle "dist/Linux Flatpak/Roselt-Calculator.flatpak"
          xvfb-run -a node scripts/smoke-desktop.cjs "$(command -v flatpak)" run --user --share=network io.github.ShaunRoselt.Calculator

      - name: Create Linux dist archive
        run: tar -czf dist-linux.tar.gz -C dist "Roselt Calculator-linux-x64" "Linux AppImage" "Linux Flatpak" "final dist"

      - name: Upload Linux dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-linux
          if-no-files-found: error
          path: dist-linux.tar.gz
          retention-days: 1

  windows:
    name: Build Windows dist
    runs-on: windows-latest
    needs: check

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows portable and unpacked apps
        run: npm run package:win

      - name: Smoke-test the packaged Windows apps
        shell: pwsh
        run: |
          $unpacked = (Resolve-Path 'dist/Windows Unpacked/Roselt Calculator.exe').Path
          $portable = (Get-ChildItem 'dist/Windows Portable' -Filter '*.exe').FullName
          $testDir = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'roselt-portable-smoke')
          $testExe = Join-Path $testDir.FullName (Split-Path $portable -Leaf)
          Copy-Item $portable $testExe
          node scripts/smoke-desktop.cjs "$unpacked"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/smoke-desktop.cjs "$testExe"

      - name: Create Windows dist archive
        shell: pwsh
        run: Compress-Archive -Path 'dist/Windows Portable', 'dist/Windows Unpacked', 'dist/final dist' -DestinationPath dist-windows.zip

      - name: Upload Windows dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-windows
          if-no-files-found: error
          path: dist-windows.zip
          retention-days: 1

  macos:
    name: Build macOS dist (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: macos-latest }
          - { arch: x64, runner: macos-15-intel }

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS app bundle
        run: npm run package:mac -- ${{ matrix.arch }}

      - name: Smoke-test the packaged macOS app
        run: node scripts/smoke-desktop.cjs "dist/macOS/Roselt Calculator-darwin-${{ matrix.arch }}/Roselt Calculator.app/Contents/MacOS/Roselt Calculator"

      - name: Create macOS dist archive
        run: tar -czf dist-macos.tar.gz -C dist macOS "final dist"

      - name: Upload macOS dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-macos-${{ matrix.arch }}
          if-no-files-found: error
          path: dist-macos.tar.gz
          retention-days: 1

  final-dist:
    name: Publish combined final dist artifact
    runs-on: ubuntu-latest
    needs:
      - linux
      - windows
      - macos

    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist-artifacts

      - name: Extract platform artifacts
        run: |
          mkdir -p dist-artifacts/extracted
          tar -xzf dist-artifacts/dist-linux/dist-linux.tar.gz -C dist-artifacts/extracted
          unzip -q dist-artifacts/dist-windows/dist-windows.zip -d dist-artifacts/extracted
          for arch in arm64 x64; do
            tar -xzf "dist-artifacts/dist-macos-$arch/dist-macos.tar.gz" -C dist-artifacts/extracted
          done

      - name: Collect release-ready files
        run: |
          mkdir -p "final dist"
          while IFS= read -r -d '' dir; do
            find "$dir" -mindepth 1 -maxdepth 1 -exec cp -a {} "final dist/" \;
          done < <(find dist-artifacts/extracted -type d -name "final dist" -print0)

      - name: Create combined final dist archive
        run: tar -czf final-dist.tar.gz "final dist"

      - name: Upload final dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: final-dist
          if-no-files-found: error
          path: final-dist.tar.gz
